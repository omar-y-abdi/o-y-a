name: ChatGPT PR4 review RED
on:
  push:
    branches: [chatgpt/pr4-review-red-20260916]
permissions:
  contents: read
jobs:
  red:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: npm ci
      - run: python -m pip install -r requirements-test.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm run build
      - name: Apply regression tests only
        env:
          PATCH_B64: 
        run: |
          printf '%s' "$PATCH_B64" | base64 -d | gzip -d | git apply
          git diff --check
      - name: Confirm new tests are RED on current product code
        run: |
          set +e
          npx vitest run tests/cms-usability.test.mjs --maxWorkers=1
          VITEST=$?
          CMS_BROWSER=chromium CMS_MODULE_CASE='cms-usability-' npm run test:cms:modules
          MODULES=$?
          set -e
          echo "vitest_status=$VITEST module_status=$MODULES"
          test "$VITEST" -ne 0
          test "$MODULES" -ne 0
