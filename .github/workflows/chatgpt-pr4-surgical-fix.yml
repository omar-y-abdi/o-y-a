name: ChatGPT PR4 surgical fix

on:
  push:
    branches: [cms-usability-20260915]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: cms-usability-20260915
          fetch-depth: 0
      - name: Apply exact reviewed replacements
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrence(s), found {actual}: {old!r}')
              p.write_text(text.replace(old, new, count))

          replace_exact(
              'tests/browser.py',
              "assert page.locator('[data-toast]').inner_text().startswith('Det kortet finns inte')",
              "expect(page.locator('[data-toast]')).to_have_text('Det kortet finns inte. Tryck fram ett nytt i stället.')",
          )
          replace_exact(
              'tests/cms-review-browser.py',
              "uploaded=Q.upload_file(a, ROOT/'public/mail/omar-smile.png')",
              "uploaded=qa.CMSBrowserQA.upload_file(a, ROOT/'public/mail/omar-smile.png')",
          )
          replace_exact(
              'src/cms/client/editor.mjs',
              "function flush() {\n    clearTimeout(timer);\n    const value = snapshot();",
              "function flush(force = false) {\n    clearTimeout(timer);\n    const value = snapshot(force);",
          )
          replace_exact(
              'src/cms/client/app.mjs',
              "change: () => active?.flush(), onError: message => toast(message, true)",
              "change: () => active?.flush(true), onError: message => toast(message, true)",
          )
          replace_exact(
              'tests/cms-modules.py',
              "change(){handle.flush()}",
              "change(){handle.flush(true)}",
              count=3,
          )
          PY
          rm .github/workflows/chatgpt-pr4-surgical-fix.yml
          git diff --check
          python -m py_compile tests/browser.py tests/cms-review-browser.py tests/cms-modules.py
          node --check src/cms/client/editor.mjs
          node --check src/cms/client/app.mjs
      - name: Commit surgical fixes
        run: |
          git config user.name 'OpenAI ChatGPT'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: synchronize browser and inspector regressions'
          git push origin HEAD:cms-usability-20260915
