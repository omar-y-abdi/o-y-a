name: ChatGPT CMS usability targeted transport diagnostic

on:
  push:
    branches:
      - chatgpt-cms-usability-ci-candidate

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Map corruption zone
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          root=Path('.github/cms-usability-bundle')
          s={i:(root/f'{i:02d}').read_text().replace('=','') for i in range(7)}
          for a,b in [(3,4),(4,5),(4,6),(5,6)]:
              A,B=s[a],s[b]
              print(f'PAIR {a:02d}->{b:02d} lens={len(A)},{len(B)}')
              for label,needle in [('A_head',A[:128]),('A_tail',A[-128:]),('B_head',B[:128]),('B_tail',B[-128:])]:
                  print(f'  {label}: inA={A.find(needle)} inB={B.find(needle)}')
          for src in (4,5):
              A=s[src]
              print(f'MAP {src:02d}:')
              offsets=range(0,len(A)-127,500)
              for off in offsets:
                  needle=A[off:off+128]
                  print(f'  off={off}: in04={s[4].find(needle)} in05={s[5].find(needle)} in06={s[6].find(needle)}')
          print('CORRUPTION-ZONE chunk04 snippets:')
          for off in range(4200,6201,100):
              needle=s[4][off:off+128]
              print(f'  off={off}: in05={s[5].find(needle)} in06={s[6].find(needle)}')
          # Detect repeated chunk prefixes inside the giant tail.
          for src in range(6):
              needle=s[src][:128]
              positions=[]; start=0
              while True:
                  p=s[6].find(needle,start)
                  if p<0: break
                  positions.append(p); start=p+1
                  if len(positions)>=20: break
              print(f'chunk{src:02d}_head_in_06={positions}')
          PY
          exit 1
