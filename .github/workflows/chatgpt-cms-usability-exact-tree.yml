name: ChatGPT CMS usability transport diagnostic

on:
  push:
    branches:
      - chatgpt-cms-usability-ci-candidate

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect bundle chunks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import string
          root = Path('.github/cms-usability-bundle')
          allowed = set(string.ascii_letters + string.digits + '+/=')
          total = ''
          for i in range(7):
              p = root / f'{i:02d}'
              s = p.read_text()
              bad = [(j, repr(ch)) for j, ch in enumerate(s) if ch not in allowed]
              pads = [j for j, ch in enumerate(s) if ch == '=']
              print(f'{i:02d}: len={len(s)} mod4={len(s)%4} pads={pads[:20]} pad_count={len(pads)} bad={bad[:20]} bad_count={len(bad)}')
              print(f'{i:02d}: head={s[:32]!r} tail={s[-32:]!r}')
              total += s
          pads = [j for j, ch in enumerate(total) if ch == '=']
          bad = [(j, repr(ch)) for j, ch in enumerate(total) if ch not in allowed]
          print(f'total: len={len(total)} mod4={len(total)%4} pad_count={len(pads)} first_pads={pads[:50]} bad_count={len(bad)} first_bad={bad[:50]}')
          PY
          exit 1
