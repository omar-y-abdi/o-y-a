name: ChatGPT CMS usability transport overlap diagnostic

on:
  push:
    branches:
      - chatgpt-cms-usability-ci-candidate

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Map duplicated transport regions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from difflib import SequenceMatcher
          root=Path('.github/cms-usability-bundle')
          s={i:(root/f'{i:02d}').read_text().replace('=','') for i in range(7)}
          for a,b in [(3,4),(4,5),(4,6),(5,6)]:
              A,B=s[a],s[b]
              print(f'PAIR {a:02d}->{b:02d}: lens {len(A)},{len(B)}')
              print('  Bhead_in_A',A.find(B[:128]),' Ahead_in_B',B.find(A[:128]))
              print('  Btail_in_A',A.find(B[-128:]),' Atail_in_B',B.find(A[-128:]))
              overlap=0
              for k in range(4,min(len(A),len(B))+1,4):
                  if A[-k:]==B[:k]: overlap=k
              print('  suffix_prefix_overlap',overlap)
          for src in (4,5):
              print(f'MAP {src:02d} snippets into 05/06')
              A=s[src]
              for off in range(0,len(A),1000):
                  needle=A[off:off+96]
                  if len(needle)<96: continue
                  print(f'  off={off}: in05={s[5].find(needle)} in06={s[6].find(needle)}')
          # Top exact matching blocks, excluding tiny coincidences.
          for a,b in [(4,5),(4,6),(5,6)]:
              sm=SequenceMatcher(None,s[a],s[b],autojunk=False)
              blocks=sorted((m for m in sm.get_matching_blocks() if m.size>=64),key=lambda m:m.size,reverse=True)[:12]
              print(f'BLOCKS {a:02d}<->{b:02d}:',[(m.a,m.b,m.size) for m in blocks])
          PY
          exit 1
