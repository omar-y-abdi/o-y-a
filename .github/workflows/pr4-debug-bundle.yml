name: Temporary PR4 debug bundle
on:
  push:
    branches: [transport/pr4-debug-20260916]
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Bundle repository
        run: |
          git fetch --all --tags --prune
          git bundle create "$RUNNER_TEMP/repo.bundle" --all
          git bundle verify "$RUNNER_TEMP/repo.bundle"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr4-debug-bundle
          path: ${{ runner.temp }}/repo.bundle
          retention-days: 1
          compression-level: 0
