name: Temporary PR4 publisher
on:
  push:
    branches: [transport/pr4-debug-20260916]
    paths:
      - .github/pr4patch.04
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Rebuild patch
        run: cat .github/pr4patch.00 .github/pr4patch.01 .github/pr4patch.02 .github/pr4patch.03 .github/pr4patch.04 | base64 -d | gzip -d > /tmp/pr4-source-fix.patch
      - name: Apply to PR branch
        run: |
          git fetch origin cms-usability-20260915
          git checkout -B pr4 origin/cms-usability-20260915
          test "$(git rev-parse HEAD)" = "43dea233db3d845849ba8f26f4e1fdaaaae7346a"
          git apply --check --index /tmp/pr4-source-fix.patch
          git apply --index /tmp/pr4-source-fix.patch
          git diff --cached --check
          git config user.name "Omar Yusuf Abdi"
          git config user.email "omaryu@chalmers.se"
          git commit -m "fix: complete CMS usability branch and stabilize archive flow"
          git push origin HEAD:cms-usability-20260915
