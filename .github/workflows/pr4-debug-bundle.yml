name: Temporary PR4 publisher
on:
  push:
    branches: [transport/pr4-debug-20260916]
    paths:
      - .github/pr4-webkit.patch.gz.b64
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Rebuild patch
        run: base64 -d .github/pr4-webkit.patch.gz.b64 | gzip -d > /tmp/pr4-webkit.patch
      - name: Apply to PR branch
        run: |
          git fetch origin cms-usability-20260915
          git checkout -B pr4 origin/cms-usability-20260915
          test "$(git rev-parse HEAD)" = "7cfe5007d1e4d77a87d0f1aa28d543fc6d361ee8"
          git apply --check --index /tmp/pr4-webkit.patch
          git apply --index /tmp/pr4-webkit.patch
          git diff --cached --check
          git config user.name "Omar Yusuf Abdi"
          git config user.email "omaryu@chalmers.se"
          git commit -m "test: make SVG visual baseline cross-browser stable"
          git push origin HEAD:cms-usability-20260915
