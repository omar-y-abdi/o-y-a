name: ChatGPT PR4 final race fixes

on:
  push:
    branches: [cms-usability-20260915]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: cms-usability-20260915
          fetch-depth: 0
      - name: Apply exact race fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrence(s), found {actual}: {old!r}')
              p.write_text(text.replace(old, new, count))

          old_revert = "    @staticmethod\n    def revert_if_dirty(page: Page) -> None:\n        button = page.locator(\"[data-action=revert]\")\n        if button.is_disabled():\n            return\n        button.click()\n        CMSBrowserQA.confirm_yes(page)\n        CMSBrowserQA.wait_canvas(page)\n"
          new_revert = "    @staticmethod\n    def revert_if_dirty(page: Page) -> None:\n        button = page.locator(\"[data-action=revert]\")\n        if button.is_disabled():\n            return\n        previous = page.locator(\"#editor iframe.gjs-frame\").element_handle()\n        try:\n            button.click()\n            CMSBrowserQA.confirm_yes(page)\n            if previous is not None:\n                page.wait_for_function('frame => !frame.isConnected', arg=previous, timeout=20000)\n            CMSBrowserQA.wait_canvas(page)\n        finally:\n            if previous is not None:\n                previous.dispose()\n"
          replace_exact('tests/cms-browser.py', old_revert, new_revert)

          old_fika = "            goto(page, \"/verkstad/\")\n            button = page.locator(\"[data-fika-button]\")\n"
          new_fika = "            goto(page, \"/verkstad/\")\n            wait_until(\n                lambda: page.locator(\"[data-memory-card][data-index]\").count() == 12,\n                description=\"spelens JavaScript-initiering\",\n            )\n            button = page.locator(\"[data-fika-button]\")\n"
          replace_exact('tests/revision_browser.py', old_fika, new_fika)
          PY
          rm .github/workflows/chatgpt-pr4-final-race-fix.yml
          git diff --check
          python -m py_compile tests/cms-browser.py tests/revision_browser.py
      - name: Commit race fixes
        run: |
          git config user.name 'OpenAI ChatGPT'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: wait for completed editor and game initialization'
          git push origin HEAD:cms-usability-20260915
