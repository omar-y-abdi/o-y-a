name: ChatGPT PR4 R20 diagnostic
on:
  push:
    branches:
      - chatgpt/pr4-ci-workspace-20260916
permissions:
  contents: read
jobs:
  r20:
    runs-on: ubuntu-24.04
    env:
      CMS_BROWSER: webkit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: npm ci
      - run: python -m pip install -r requirements-test.txt
      - run: python -m playwright install --with-deps webkit
      - run: npm run build
      - name: Apply candidate synchronization fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/cms-modules.py')
          text = path.read_text()
          old = '''            assert page.evaluate("snapshots.at(-1).html.includes('changed')")'''
          new = '''            page.wait_for_function("snapshots.at(-1)?.html.includes('changed')")'''
          if old not in text: raise SystemExit('target assertion not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Run full WebKit module suite twice
        run: |
          npm run test:cms:modules
          npm run test:cms:modules
