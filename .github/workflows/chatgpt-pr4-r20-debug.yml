name: ChatGPT PR4 revert diagnostic
on:
  push:
    branches:
      - chatgpt/pr4-ci-workspace-20260916
permissions:
  contents: read
jobs:
  revert:
    runs-on: ubuntu-24.04
    env:
      CMS_BROWSER: webkit
      CMS_REVIEW_CASE: independent-tabs-save-revert-reload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: cms-usability-20260915
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: npm ci
      - run: python -m pip install -r requirements-test.txt
      - run: python -m playwright install --with-deps webkit
      - run: npm run build
      - name: Apply candidate revert synchronization fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/cms-browser.py')
          text = path.read_text()
          old = '''    @staticmethod\n    def revert_if_dirty(page: Page) -> None:\n        button = page.locator("[data-action=revert]")\n        if button.is_disabled():\n            return\n        button.click()\n        CMSBrowserQA.confirm_yes(page)\n        CMSBrowserQA.wait_canvas(page)\n'''
          new = '''    @staticmethod\n    def revert_if_dirty(page: Page) -> None:\n        button = page.locator("[data-action=revert]")\n        if button.is_disabled():\n            return\n        previous = page.locator("#editor iframe.gjs-frame").element_handle()\n        try:\n            button.click()\n            CMSBrowserQA.confirm_yes(page)\n            if previous is not None:\n                page.wait_for_function('frame => !frame.isConnected', arg=previous, timeout=20000)\n            CMSBrowserQA.wait_canvas(page)\n        finally:\n            if previous is not None:\n                previous.dispose()\n'''
          if text.count(old) != 1: raise SystemExit('revert helper target not found exactly once')
          path.write_text(text.replace(old, new))
          PY
          python -m py_compile tests/cms-browser.py
          git diff --check
      - name: Run targeted WebKit revert regression three times
        run: |
          node scripts/test-cms-parallel.mjs tests/cms-review-browser.py
          node scripts/test-cms-parallel.mjs tests/cms-review-browser.py
          node scripts/test-cms-parallel.mjs tests/cms-review-browser.py
