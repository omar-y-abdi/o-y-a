name: ChatGPT review bundle bridge

on:
  push:
    branches:
      - chatgpt-review-bridge-20260916-1841

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build complete repository bundle
        run: |
          git fetch --all --tags --prune
          git bundle create repo.bundle --all
          git bundle verify repo.bundle
          git show-ref > refs.txt
      - uses: actions/upload-artifact@v4
        with:
          name: repo-bundle
          path: |
            repo.bundle
            refs.txt
          retention-days: 1
