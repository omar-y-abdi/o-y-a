name: Portfolio and CMS
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      historical_errors_json:
        description: 'Reviewed JSON object mapping versions 1-4 and 84-88 to their exact recorded compatibility errors'
        required: true
        type: string
permissions:
  contents: read
jobs:
  quality:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARD_CORPUS: pr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Historical Worker builds pin the real deployed BASE.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      - name: Audit current locked dependencies
        run: npm audit --audit-level=moderate
      - run: npx playwright install --with-deps chromium
      - name: Build, security, storage and public browser regressions
        run: npm run quality
      - name: SKIFT game unit regressions
        run: node --test --test-concurrency=1 games/skift/tests/*.test.mjs
      - name: Worker deploy dry-run
        run: npx wrangler deploy --dry-run --outdir artifacts/worker-build --metafile artifacts/worker-build/bundle-meta.json
      - name: Verify full notices against the deployed Worker bundle
        run: node scripts/third-party-notices.mjs artifacts/worker-build/bundle-meta.json
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-evidence
          path: |
            output/playwright/**
            artifacts/screenshots/*.png
          retention-days: 14

  skift-release:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: games/skift
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: games/skift/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Standalone source, extracted rebuild and released browser regression
        run: npm run release
      - name: Retain distributable and exact browser receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: skift-release
          path: |
            games/skift/SKIFT-*.zip
            games/skift/SKIFT-*.zip.sha256
            games/skift/evidence/released-archive.json
            games/skift/evidence/released-trace.zip
          retention-days: 14

  editor-compatibility:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run build
      - run: npx playwright test --project=${{ matrix.browser }} --no-deps
        # Four concurrent heavy WebKit studios stalled a click. Isolate resources
        # without changing deadlines; this experiment does not establish an app cause.
        env:
          PLAYWRIGHT_WORKERS: ${{ matrix.browser == 'webkit' && '1' || '4' }}
      - name: Retain compatibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: editor-${{ matrix.browser }}
          path: output/playwright/**
          retention-days: 14

  functional-browser:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # Independent port-0 fixtures.
      - name: Frame parity, browser ports and library regressions
        run: >-
          npx playwright test
          tests/cms-frame-public.spec.mjs
          tests/cms-frame-recovery.spec.mjs
          tests/cms-preview.spec.mjs
          tests/cms-browser.spec.mjs
          tests/cms-interactions.spec.mjs
          tests/cms-review-browser.spec.mjs
          tests/cms-review-final-browser.spec.mjs
          tests/cms-modules.spec.mjs
          tests/footer-cms-browser.spec.mjs
          tests/test_cms_browser_helpers.spec.mjs
          tests/test_cms_asset_usage.spec.mjs
          tests/cms-library.spec.mjs
          tests/managed-svg-fidelity.spec.mjs
          tests/cms-editor.spec.mjs
          tests/cms-email.spec.mjs
          --project=chromium --no-deps --workers=2
      - name: Retain functional browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: functional-browser-evidence
          path: output/playwright/**
          retention-days: 14

  # Manual only. Needs repository secrets CLOUDFLARE_D1_READ_TOKEN (D1 read)
  # and CLOUDFLARE_ACCOUNT_ID; CI has no D1 credentials by default.
  stored-revisions:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_READ_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Validate reviewed historical exceptions
        env:
          HISTORICAL_ERRORS_JSON: ${{ inputs.historical_errors_json }}
        run: |
          errors_file="$(mktemp "$RUNNER_TEMP/cms-allow-errors.XXXXXX.json")"
          HISTORICAL_ERRORS_FILE="$errors_file" node scripts/cms-release-errors.mjs
          printf 'CMS_ALLOW_ERRORS_FILE=%s\n' "$errors_file" >> "$GITHUB_ENV"
      # Exact error matching only; the current head is never tolerated.
      - run: node scripts/cms-pull-release.mjs --all --allow=1-4,84-88 --allow-errors="$CMS_ALLOW_ERRORS_FILE"

  card-exports-full:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0 # Pull request scope diffs against the base branch.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      - name: Decide whether card inputs changed
        id: scope
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "origin/$GITHUB_BASE_REF...HEAD")"
          if grep -Eq '^(\.github/workflows/ci\.yml|package\.json|package-lock\.json|playwright\.config\.mjs|public/data/cards\.json|src/client/(main|privacy|copy|previewdata|joy|playlogic|cards|win|games|memory)\.mjs|src/cms/(render|store|project|frame|frame-converter|legacy-project|theme|theme-core)\.mjs|src/content/win-design\.mjs|src/csp\.mjs|src/worker\.mjs|src/templates/(layout|pages|components)\.mjs|src/styles/(base|home|pages|toys|games)\.css|scripts/(build|build-cms|cms-dev)\.mjs|tests/card-export\.spec\.mjs|tests/fixtures/cms-v185-project\.json|tests/helpers/(card-[^/]+|cms-runtime|public-test)\.mjs)$' <<< "$changed"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Chromium
        if: steps.scope.outputs.run == 'true'
        run: npx playwright install --with-deps chromium
      - name: Build
        if: steps.scope.outputs.run == 'true'
        run: npm run build
      - name: Full 240-card export matrix
        if: steps.scope.outputs.run == 'true'
        env:
          PLAYWRIGHT_PORT: '4173'
        run: npx playwright test tests/card-export.spec.mjs --project=chromium --no-deps --grep='all 240 production card exports' --workers=1 --output=output/playwright/artifacts/card-exports
      - name: Retain card export evidence
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: card-exports-full
          path: output/playwright/**
          retention-days: 14
