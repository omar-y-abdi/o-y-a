name: Portfolio and CMS
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: npm ci
      - run: python -m pip install -r requirements-test.txt
      - run: python -m playwright install --with-deps chromium
      - name: Build, security, storage and public browser regressions
        run: npm run quality
      - name: Worker deploy dry-run
        run: npx wrangler deploy --dry-run --outdir artifacts/worker-build
      - name: Real Worker CMS browser verification
        run: npm run test:cms
      - name: Legacy footer CMS edit and reload regression
        run: node scripts/test-footer-cms.mjs
      - name: Editor resize, paste and SVG regressions
        run: npx playwright test tests/cms-editor.spec.mjs --project=chromium
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-evidence
          path: |
            artifacts/*.json
            artifacts/screenshots/*.png
            output/logs/cms-browser.log
            output/visual/cms/*.png
            output/visual/studio/*.png
            output/logs/cms-interactions.log
            output/logs/cms-review*.log
            output/visual/review/**/*.png
            output/visual/review-final/**/*.png
            output/cms-modules/results.json
            output/cms-modules/*.png
            output/revision/browser/revision-browser.json
            output/logs/footer-*.log
            output/visual/footer/**/*.png
            output/card-export/card-export-report.json
            output/playwright/artifacts/**
          retention-days: 14

  editor-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    env:
      CMS_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.node-version'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: npm ci
      - run: python -m pip install -r requirements-test.txt
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run build
      - run: node scripts/test-cms-modules-parallel.mjs
      - run: node scripts/test-cms-parallel.mjs tests/cms-review-browser.py tests/cms-review-final-browser.py
      - run: node scripts/test-footer-cms.mjs
      - run: npx playwright test tests/cms-editor.spec.mjs --project=${{ matrix.browser }}
      - name: Retain compatibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: editor-${{ matrix.browser }}
          path: |
            output/logs/cms-review*.log
            output/visual/review/**/*.png
            output/visual/review-final/**/*.png
            output/cms-modules/results.json
            output/cms-modules/*.png
            output/logs/footer-*.log
            output/visual/footer/**/*.png
            output/playwright/artifacts/**
          retention-days: 14

  # Manual only. Needs repository secrets CLOUDFLARE_D1_READ_TOKEN (D1 read)
  # and CLOUDFLARE_ACCOUNT_ID; CI has no D1 credentials by default.
  stored-revisions:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_READ_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      - run: npm run build
      # Full retained history, same cms_media copy. v1-v4 and v84-v88 are known
      # pre-fix failures; the head revision is never tolerated.
      - run: node scripts/cms-pull-release.mjs --all --allow=1-4,84-88
