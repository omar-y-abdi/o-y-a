name: ChatGPT PR4 review GREEN2
on:
  push:
    branches: [chatgpt/pr4-review-red-20260916]
permissions:
  contents: read
jobs:
  green2:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: npm ci
      - run: python -m pip install -r requirements-test.txt
      - run: python -m playwright install --with-deps chromium
      - name: Apply validated fixes and regression tests
        env:
          PATCH_B64: 
        run: |
          printf '%s' "$PATCH_B64" | base64 -d | gzip -d | git apply
          git diff --check
          for f in src/cms/api.mjs src/cms/assets.mjs src/cms/client/clone.mjs src/cms/client/editor.mjs src/cms/client/position.mjs src/cms/client/view-state.mjs src/cms/compatibility.mjs src/cms/resources.mjs src/cms/shared-content.mjs src/cms/store.mjs; do node --check "$f"; done
          python -m py_compile tests/cms-modules.py
      - run: npm run build
      - name: Focused GREEN regressions
        run: |
          npx vitest run tests/cms-usability.test.mjs --maxWorkers=1
          CMS_BROWSER=chromium CMS_MODULE_CASE='cms-usability-' npm run test:cms:modules
